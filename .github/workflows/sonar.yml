name: Sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend tests run dependency code, so they run in a job that is never
  # given the Sonar credential. The analysis job receives only the report.
  frontend-coverage:
    name: Frontend coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/omgcode-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the locked dependencies
        # The flag repeats what .npmrc sets, so no package install script runs
        # even if that file changes.
        run: npm ci --ignore-scripts
      - name: Run the tests with coverage
        run: npm run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: crates/omgcode-desktop/ui/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Sonar analysis
    needs: frontend-coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the frontend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: crates/omgcode-desktop/ui/coverage
      - name: Require the analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Add the SONAR_TOKEN repository secret for the OMGCode Sonar project."
            exit 1
          fi
      - name: Activate the project Rust toolchain when present
        if: hashFiles('**/Cargo.toml') != ''
        run: rustup show active-toolchain
      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true
