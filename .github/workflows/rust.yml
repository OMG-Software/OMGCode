name: Rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install the desktop shell's Linux build packages
        if: runner.os == 'Linux'
        run: |
          # The Tauri prerequisites for Debian and Ubuntu. They are needed to
          # compile the desktop crate; no test here starts a webview.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the desktop frontend
        # The desktop crate embeds ui/dist at compile time, so the frontend
        # must be built before any workspace-wide Cargo step.
        working-directory: crates/omgcode-desktop/ui
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Check lints and compilation
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Start a user service manager for delegated cgroups
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 1 50); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 0.2
          done
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_dir" systemd-run --user --scope --quiet -p Delegate=yes -- cat /proc/self/cgroup
      - name: Start an unlocked Secret Service for credential tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring
          # One empty line is an empty password. It creates and unlocks the
          # login collection, which becomes the default alias; empty input
          # (no newline) creates no collection.
          printf '\n' | gnome-keyring-daemon --unlock --components=secrets
          for _ in $(seq 1 50); do
            busctl --user call org.freedesktop.secrets /org/freedesktop/secrets \
              org.freedesktop.Secret.Service ReadAlias s default 2>/dev/null \
              | grep -q '/collection/' && break
            sleep 0.2
          done
          busctl --user call org.freedesktop.secrets /org/freedesktop/secrets \
            org.freedesktop.Secret.Service ReadAlias s default | grep '/collection/'
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Run documentation tests
        run: cargo test --workspace --doc --locked
