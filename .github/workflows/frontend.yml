name: Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Desktop frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/omgcode-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the locked dependencies
        # The flag repeats what .npmrc sets, so no package install script runs
        # even if that file changes.
        run: npm ci --ignore-scripts
      - name: Check types
        run: npm run check
      - name: Check formatting and lints
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build and check the bundles
        run: npm run test:dist
