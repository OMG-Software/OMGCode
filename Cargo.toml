[workspace]
resolver = "3"
members = ["crates/omgcode-core", "crates/omgcode-cli", "crates/omgcode-platform", "crates/omgcode-app", "crates/omgcode-desktop"]

[workspace.package]
version = "0.67.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

repository = "https://github.com/OMG-Software/OMGCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time", "net", "fs", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6"
tempfile = "3"
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "process"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
# ChatGPT sign-in (ADR-0093): RS256 ID-token verification with a public key
# only, base64url decoding, and the random state, nonce, and PKCE verifier.
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4.3", default-features = false }
# Already in the tree through reqwest; named so an outgoing token form is held
# in a buffer that is zeroed when reqwest drops it (ADR-0093).
bytes = { version = "1.12.1", default-features = false }
# Event-level YAML parser for skill frontmatter (ADR-0057). No value tree is built.
saphyr-parser = "0.3.4"
# Derived session index cache (ADR pending). Bundled SQLite; no extension loading.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
secret-service = { version = "5.2", default-features = false, features = ["rt-tokio-crypto-rust"] }
# Pinned to the version secret-service already uses, with the same features,
# for raw Secret Service calls that refuse prompts (ADR-0042).
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api", "tokio"] }

# Pure-Rust Git reader for the Git status tab (ADR-0085). No network, credential,
# transport, or fsmonitor feature, no C compression backend, and Git is never run.
gix = { version = "=0.91.0", default-features = false, features = ["status", "sha1"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.metadata]
license = "Apache-2.0"
