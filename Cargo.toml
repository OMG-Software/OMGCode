[workspace]
resolver = "3"
members = ["crates/omgcode-core", "crates/omgcode-cli", "crates/omgcode-platform"]

[workspace.package]
version = "0.25.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

repository = "https://github.com/OMG-Software/OMGCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
thiserror = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6"
tempfile = "3"
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.metadata]
license = "Apache-2.0"
