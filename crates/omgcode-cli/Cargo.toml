[package]
name = "omgcode-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local CLI for the OMGCode coding-assistant core"

[[bin]]
name = "omgcode"
path = "src/main.rs"

[dependencies]
omgcode-app = { path = "../omgcode-app" }
omgcode-core = { path = "../omgcode-core" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The test binary is also the fake `claude`, so it needs its own `main`
# (ADR-0109).
[[test]]
name = "claude_code_cli"
harness = false

[lints]
workspace = true
