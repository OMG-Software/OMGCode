sonar.projectKey=OMG-Software_OMGCode
sonar.organization=omg-software
sonar.projectName=OMGCode
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Test code is declared as test code, so Sonar applies its test rules to it and
# does not count it as code to cover or measure it for duplication. The same
# patterns are excluded from the sources, because a file cannot be both.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/tests.rs,**/*.test.ts
sonar.exclusions=**/.git/**,**/target/**,**/node_modules/**,**/dist/**,**/coverage/**,**/tests/**,**/tests.rs,**/*.test.ts
